<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SG MotoLux — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#07090d;color:#f5f7fb;font:15px Arial,sans-serif}
header{padding:12px 25px;border-bottom:1px solid #263347;display:flex;justify-content:space-between;align-items:center;background:#07090dee;position:sticky;top:0;z-index:3}
.logo{height:55px;max-width:210px}main{max-width:1100px;margin:auto;padding:25px 18px}
.box{background:#0e141c;border:1px solid #263347;border-radius:16px;padding:20px;margin:18px 0}
h1,h2{margin-top:0}input,select,textarea{width:100%;box-sizing:border-box;background:#080c12;color:#fff;border:1px solid #2a394d;border-radius:8px;padding:11px;margin-top:5px}
button{padding:10px 14px;border-radius:9px;border:1px solid #304158;background:#17202d;color:#fff;font-weight:bold;cursor:pointer}
.primary{background:#168cff;border:0}.danger{background:#35131a;color:#ff9ca8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:15px;background:#0e141c;border:1px solid #263347;border-radius:14px}.stat b{font-size:25px}.stat span{display:block;color:#91a0b3;font-size:12px}
.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #263347;border-radius:14px;overflow:hidden;background:#0a0f16}.cover{height:170px;background:#111a27;display:flex;align-items:center;justify-content:center;color:#66758a}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.meta{font-size:12px;color:#91a0b3;line-height:1.6}.price{font-size:18px;font-weight:bold;margin:9px 0}.actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hidden{display:none}.muted{color:#91a0b3}.msg{padding:10px;border-radius:8px;margin:10px 0;background:#092119;color:#9af1c9}.error{background:#2a1015;color:#ffadb7}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview{width:100px;height:75px;position:relative}.preview img{width:100%;height:100%;object-fit:cover;border-radius:7px}
@media(max-width:750px){.grid,.inventory,.stats{grid-template-columns:1fr}}

/* SG MotoLux Admin — mobile optimization */
@media (max-width: 700px){
  body{font-size:14px;overflow-x:hidden}
  header{padding:10px 12px;gap:10px;flex-wrap:wrap}
  .logo{height:42px;max-width:155px;object-fit:contain}
  header button{padding:9px 11px;font-size:13px}
  main{padding:12px 10px;max-width:none}
  .box{padding:14px 12px;margin:12px 0;border-radius:13px}
  h1{font-size:22px;line-height:1.2}
  h2{font-size:18px}
  h3{font-size:16px}
  input,select,textarea{font-size:16px;padding:12px 10px;min-height:44px}
  button{min-height:44px;padding:10px 12px;font-size:14px}
  .primary{width:100%}
  table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .grid,.row,.form-grid,.cols{grid-template-columns:1fr !important}
  .cards{grid-template-columns:1fr !important}
  img{max-width:100%}
  .moto-card{width:100% !important}
  .actions{display:flex;flex-direction:column;gap:8px}
  .actions button{width:100%}
  label{display:block;margin-bottom:10px}
}
@media (max-width: 420px){
  header{align-items:center}
  .logo{height:38px;max-width:140px}
  main{padding:9px 8px}
  .box{padding:12px 10px}
}

</style></head>

<main>
<section id="login" class="box">
<h1>🔐 SG MotoLux — Acceso</h1>
<p class="muted">Ingresa con tu correo y contraseña para administrar el inventario.</p>
<label>Correo<input id="email" type="email" placeholder="tu correo"></label><br>
<label>Contraseña<input id="password" type="password" placeholder="••••••••"></label>
<div class="actions"><button class="primary" onclick="login()">Iniciar sesión</button></div>
<div id="loginMsg"></div>
</section>

<section id="admin" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<div><h1>Inventario SG MotoLux</h1><div class="muted">Solo usuarios autenticados pueden administrar.</div></div>
<div><button onclick="openForm()" class="primary">＋ AGREGAR MOTO</button> <button onclick="logout()">Cerrar sesión</button></div>
</div>
<div id="msg"></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="available">0</b><span>Disponibles</span></div><div class="stat"><b id="sold">0</b><span>Vendidas</span></div></div>

<section id="form" class="box hidden">
<h2 id="formTitle">Agregar moto</h2>
<div class="grid">
<label>Marca *<input id="marca"></label><label>Referencia *<input id="referencia"></label>
<label>Año *<input id="anio" type="number"></label><label>Kilometraje<input id="kilometraje" type="number"></label>
<label>Precio<input id="precio" type="number"></label><label>Cilindraje<input id="cilindraje"></label>
<label>SOAT hasta<input id="soat" type="date"></label><label>Tecnomecánica hasta<input id="tecno" type="date"></label>
<label>Impuestos<select id="impuestos"><option>Al día</option><option>Debe impuestos</option><option>No sé</option></select></label>
<label>Estado<select id="estado"><option value="available">Disponible</option><option value="sold">Vendida</option></select></label>
<label class="full">Descripción<textarea id="descripcion"></textarea></label>
<label class="full">Fotos<input id="photos" type="file" accept="image/*" multiple onchange="selectPhotos(event)"><div id="previews" class="previews"></div></label>
</div>
<div class="actions"><button onclick="closeForm()">Cancelar</button><button class="primary" onclick="saveBike()">Guardar en la nube</button></div>
</section>

<section class="box"><h2>Mis motos</h2><div id="inventory" class="inventory">Cargando...</div></section>
</section>
</main>

<script>
const SUPABASE_URL="https://prrcvbextfcecgddyafn.supabase.co";
const SUPABASE_KEY="sb_publishable_lcbD-IV3nSbAvGYRZmqgkA_dcR3iXeL";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let editing=null,files=[],old=[];

function $(id){return document.getElementById(id)}
function msg(t,e=false){$("msg").textContent=t;$("msg").className=e?"error":""}
function loginMsg(t,e=false){$("loginMsg").textContent=t;$("loginMsg").className=e?"error":""}
async function login(){
 const email=$("email").value.trim(), password=$("password").value;
 const r=await sb.auth.signInWithPassword({email,password});
 if(r.error){loginMsg("No se pudo iniciar sesión: "+r.error.message,true);return}
 loginMsg(""); showAdmin(r.data.session.user);
}
async function logout(){await sb.auth.signOut();$("admin").classList.add("hidden");$("login").classList.remove("hidden");$("userArea").textContent=""}
function showAdmin(user){$("login").classList.add("hidden");$("admin").classList.remove("hidden");$("userArea").textContent="🔐 "+user.email;load()}
async function init(){const r=await sb.auth.getSession();if(r.data.session)showAdmin(r.data.session.user);else{$("admin").classList.add("hidden");$("login").classList.remove("hidden")}}
function money(n){return n?new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n):"Consultar"}
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
async function load(){
 let r=await sb.from("motos").select("*").order("created_at",{ascending:false});
 if(r.error){msg(r.error.message,true);return}
 let d=r.data||[];$("total").textContent=d.length;$("available").textContent=d.filter(x=>x.estado==="available").length;$("sold").textContent=d.filter(x=>x.estado==="sold").length;
 $("inventory").innerHTML=d.length?d.map(b=>{let p=(b.fotos||[])[0];return `<article class="card"><div class="cover">${p?`<img src="${p}">`:"SIN FOTO"}</div><div class="body"><b>${esc(b.marca)} ${esc(b.referencia)}</b><div class="meta">${b.anio} · ${(b.kilometraje||0).toLocaleString("es-CO")} km · ${esc(b.cilindraje||"")}</div><div class="price">${money(b.precio)}</div><div class="actions"><button onclick="editBike('${b.id}')">Editar</button><button onclick="toggleStatus('${b.id}','${b.estado}')">${b.estado==="sold"?"Publicar":"Vendida"}</button><button class="danger" onclick="deleteBike('${b.id}')">Eliminar</button></div></div></article>`}).join(""):"<div class='muted'>No hay motos todavía.</div>"
}
function openForm(){editing=null;files=[];old=[];$("formTitle").textContent="Agregar moto";document.querySelectorAll("#form input,#form textarea").forEach(x=>{if(x.id!=="photos")x.value=""});$("impuestos").value="Al día";$("estado").value="available";$("previews").innerHTML="";$("form").classList.remove("hidden")}
function closeForm(){$("form").classList.add("hidden")}
function selectPhotos(e){files.push(...e.target.files);e.target.value="";drawPreviews()}
function drawPreviews(){$("previews").innerHTML=old.map(x=>`<img src="${x}" style="width:100px;height:75px;object-fit:cover">`).join("")+files.map(x=>`<img src="${URL.createObjectURL(x)}" style="width:100px;height:75px;object-fit:cover">`).join("")}
async function saveBike(){
 let marca=$("marca").value.trim(),referencia=$("referencia").value.trim(),anio=+$("anio").value;if(!marca||!referencia||!anio){msg("Completa marca, referencia y año.",true);return}
 try{let base={marca,referencia,anio,kilometraje:+$("kilometraje").value||0,precio:+$("precio").value||0,cilindraje:$("cilindraje").value,soat_hasta:$("soat").value||null,tecnomecanica_hasta:$("tecno").value||null,impuestos:$("impuestos").value,estado:$("estado").value,descripcion:$("descripcion").value};let id=editing;
 if(!id){let x=await sb.from("motos").insert(base).select("id").single();if(x.error)throw x.error;id=x.data.id}
 let urls=[...old];for(let f of files){let ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=id+"/"+crypto.randomUUID()+"."+ext;let x=await sb.storage.from("motos").upload(path,f);if(x.error)throw x.error;urls.push(SUPABASE_URL+"/storage/v1/object/public/motos/"+path)}
 let x=await sb.from("motos").update({...base,fotos:urls,updated_at:new Date().toISOString()}).eq("id",id);if(x.error)throw x.error;msg("Moto guardada en la nube.");closeForm();load()
 }catch(e){msg("Error: "+e.message,true)}
}
async function editBike(id){let x=await sb.from("motos").select("*").eq("id",id).single();if(x.error){msg(x.error.message,true);return}let b=x.data;editing=id;old=b.fotos||[];files=[];$("formTitle").textContent="Editar moto";for(let [k,v] of Object.entries({marca:b.marca,referencia:b.referencia,anio:b.anio,kilometraje:b.kilometraje,precio:b.precio,cilindraje:b.cilindraje,soat:b.soat_hasta||"",tecno:b.tecnomecanica_hasta||"",impuestos:b.impuestos,estado:b.estado,descripcion:b.descripcion||""}))$(k).value=v;drawPreviews();$("form").classList.remove("hidden")}
async function toggleStatus(id,s){let x=await sb.from("motos").update({estado:s==="sold"?"available":"sold"}).eq("id",id);if(x.error)msg(x.error.message,true);load()}
async function deleteBike(id){if(!confirm("¿Eliminar esta moto?"))return;let x=await sb.from("motos").delete().eq("id",id);if(x.error)msg(x.error.message,true);load()}
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){$("admin").classList.add("hidden");$("login").classList.remove("hidden")}});
init();
</script></body></html>
